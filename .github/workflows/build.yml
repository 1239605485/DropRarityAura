name: Build KernelLoader mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [android-arm64, windows-x86, windows-x64, linux-x86, linux-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: eternalfuture-e38299/TEFKernel-KernelLoader
          ref: 1316f21415ceb7d15626e9eaae1e70bc4833a913
          path: .deps/KernelLoader
      - uses: android-actions/setup-android@v4
        if: matrix.target == 'android-arm64'
        with:
          packages: ''
      - name: Install Android NDK
        if: matrix.target == 'android-arm64'
        run: sdkmanager --install "ndk;27.2.12479018"
      - name: Install desktop compilers
        if: matrix.target != 'android-arm64'
        run: sudo apt-get update && sudo apt-get install -y g++-multilib g++-mingw-w64-i686-posix g++-mingw-w64-x86-64-posix
      - name: Check original item rendering and rarity tiers
        run: |
          g++ -std=c++17 -D__ANDROID__ -D__aarch64__ -I.deps/KernelLoader/includes -I.deps/KernelLoader/mod-api tests/item_draw_hook_test.cpp src/kernel_api.cpp src/rarity_palette.cpp -o /tmp/item-hook-test
          /tmp/item-hook-test
          g++ -std=c++17 -Isrc tests/rarity_style_test.cpp src/loot_style.cpp src/rarity_profile.cpp -o /tmp/rarity-style-test
          /tmp/rarity-style-test
          python3 scripts/generate_effects.py /tmp/effect-resources/effects
          g++ -std=c++17 -D__ANDROID__ -D__aarch64__ -I.deps/KernelLoader/includes -I.deps/KernelLoader/mod-api tests/texture_lifetime_test.cpp src/kernel_api.cpp src/loot_style.cpp src/rarity_profile.cpp -o /tmp/texture-lifetime-test
          /tmp/texture-lifetime-test /tmp/effect-resources
          g++ -std=c++17 -I.deps/KernelLoader/includes -I.deps/KernelLoader/mod-api tests/desktop_renderer_test.cpp src/kernel_api.cpp src/loot_style.cpp src/rarity_profile.cpp -o /tmp/desktop-renderer-test
          /tmp/desktop-renderer-test /tmp/effect-resources
      - name: Build mod
        env:
          KERNELLOADER_DIR: ${{ github.workspace }}/.deps/KernelLoader
        run: export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" && bash build.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: DropRarityAura-${{ matrix.target }}
          path: DropRarityAura-${{ matrix.target }}.zip
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: DropRarityAura-*
          path: platform-packages
          merge-multiple: true
      - name: Assemble all-platform package
        run: python3 scripts/combine_packages.py platform-packages DropRarityAura-all-platforms.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DropRarityAura-all-platforms
          path: DropRarityAura-all-platforms.zip
          if-no-files-found: error
